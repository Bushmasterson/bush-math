name: Render
on: [push, pull_request]
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install manim
      - run: |
          for f in scenes/*.py; do
            manim -ql --disable_caching "$f" || exit 1
          done